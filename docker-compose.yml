# 第 3 周 Day 5-6：本地 KRaft 单节点 Kafka
# 用法：
#   docker compose up -d kafka
#   docker compose logs -f kafka
#   docker compose down            # 保留数据卷；加 -v 连数据一起删
#
# 宿主机（IDEA 里启动的应用）连接 localhost:9092；
# 如果应用也跑在 compose 网络里，把 KAFKA_BOOTSTRAP_SERVERS 改成 kafka:9092，
# 并把 KAFKA_ADVERTISED_LISTENERS 改成 PLAINTEXT://kafka:9092。
services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: web3-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      # KRaft 单节点：broker + controller 同进程，不依赖 ZooKeeper
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      # KRaft 合并模式下 advertised.listeners 必须同时列出 CONTROLLER 监听器，
      # 否则 controller 对外地址会回退到 listeners 的 0.0.0.0，启动校验直接失败。
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,CONTROLLER://localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # 单节点必须把内部 topic 副本数降到 1，否则 topic 创建会失败
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      # kafka-topics.sh 每次要起一个 JVM，5s 容易超时；给足 15s 避免容器长时间卡在 starting
      timeout: 15s
      retries: 12

volumes:
  kafka-data: