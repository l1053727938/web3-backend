server:
  port: 8080

spring:
  application:
    name: web3-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:web3_backend}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root123}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      # 连接有效性校验：借出连接前用测试语句验证，剔除被 MySQL/网络中间件静默断开的死连接
      connection-test-query: SELECT 1
      # 校验超时(ms)：判定连接是否存活的最长等待
      validation-timeout: 3000
      # 获取连接超时(ms)：池耗尽时调用方最长阻塞时间，超时抛 SQLException 而非无限等待
      connection-timeout: 30000
      # 连接最大存活(ms)：小于 MySQL wait_timeout，主动回收防服务端单方面断连；空闲连接超时回收
      max-lifetime: 1800000
      idle-timeout: 600000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 本地 Redis 无密码时不要配置 password 行（包括空字符串），否则 Redisson 仍会发送 AUTH 导致启动报错
      database: ${REDIS_DATABASE:0}

# ============ MyBatis-Plus ============
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

# ============ Web3j / Infura ============
web3:
  infura:
    project-id: ${INFURA_PROJECT_ID:}
    # HTTP RPC 代理：本机开了系统代理(如 Clash 127.0.0.1:7890)、Java 默认不走代理会导致主网超时
    # 需要时去掉下面两行注释（或用环境变量 WEB3_PROXY_HOST/WEB3_PROXY_PORT 注入）；留空则直连
    proxy-host: ${WEB3_PROXY_HOST:127.0.0.1}
    proxy-port: ${WEB3_PROXY_PORT:7890}
#    http-url: http://127.0.0.1:8545
#    http-url: https://sepolia.infura.io/v3/${INFURA_PROJECT_ID:}
#    http-url: https://mainnet.infura.io/v3/${INFURA_PROJECT_ID:}
    http-url: https://eth-mainnet.g.alchemy.com/v2/${ALCHEMY_PROJECT_ID:}
#    http-url: https://eth-sepolia.g.alchemy.com/v2/${ALCHEMY_PROJECT_ID:}
#    chain-id: 11155111   # Sepolia 测试网；主网为 1，对应改 https://mainnet.infura.io
    chain-id: 1   # Sepolia 测试网；主网为 1，对应改 https://mainnet.infura.io
    # eth_getLogs 分页单段最大区块跨度，节点限制更严时可调小（如 500/1000）
    log-chunk-size: ${WEB3_LOG_CHUNK_SIZE:50}
  # ============ 历史日志补拉（监听器启动时的状态补齐）============
  backfill:
    enabled: ${WEB3_BACKFILL_ENABLED:false}
    # 单页区块跨度：节点单次结果上限(Infura 10000 条)被打穿时由 EventLogService 自动缩跨度续拉，无需手工调小
    chunk-size: ${WEB3_BACKFILL_CHUNK_SIZE:1000}
    # 单次请求最多推进的区块数，0=不限；设为正数可把大区间拆成多次调用（下次从游标自动续拉）
    max-blocks-per-run: ${WEB3_BACKFILL_MAX_BLOCKS:0}
    # 游标读优先走 Redis（关闭后每次直读 MySQL，Redis 不可用时也自动降级）
    cursor-cache-enabled: ${WEB3_BACKFILL_CURSOR_CACHE:true}
    # ===== 定时自动核对：周期性把各合约从游标补拉到链上最新高度，兜底实时链路的缺口 =====
    auto-enabled: ${WEB3_BACKFILL_AUTO_ENABLED:false}
    auto-interval-ms: ${WEB3_BACKFILL_AUTO_INTERVAL_MS:30000}
    # 核对合约清单；留空回退 web3.websocket.watch-contracts（实时盯的合约与核对的合约口径一致）
    auto-contracts: ${WEB3_BACKFILL_AUTO_CONTRACTS:0x5FbDB2315678afecb367f032d93F642f64180aa3}
    # 无游标合约的首次起步区块；-1=跳过（默认），先手动补拉建立游标后定时任务才接管，
    # 设 0/具体块号则定时任务会对新合约直接发起大区间历史扫描，主网慎用
    auto-from-block: ${WEB3_BACKFILL_AUTO_FROM_BLOCK:-1}
  # ============ WebSocket 实时订阅（newHeads & logs）============
  # 默认关闭，需要时打开 enabled（本地 Anvil 或 Infura WS 端点）
  websocket:
    enabled: ${WEB3_WS_ENABLED:false}
    # Anvil: ws://127.0.0.1:8545   Infura: wss://mainnet.infura.io/ws/v3/{projectId}
#    url: ${WEB3_WS_URL:ws://127.0.0.1:8545}
#    url: wss://eth-mainnet.g.alchemy.com/v2/${ALCHEMY_PROJECT_ID:}
#    url: wss://eth-sepolia.g.alchemy.com/v2/${ALCHEMY_PROJECT_ID:}
    url: wss://mainnet.infura.io/ws/v3/${INFURA_PROJECT_ID:}
#    url: wss://sepolia.infura.io/ws/v3/${INFURA_PROJECT_ID:}
    # wss 代理：底层 Java-WebSocket 不读系统代理/JVM 代理参数，必须在此显式配置（留空则直连）
#    proxy-host: ${WEB3_PROXY_HOST:127.0.0.1}
#    proxy-port: ${WEB3_PROXY_PORT:7890}
    subscribe-new-heads: false
    # 监听 Transfer 日志的合约地址，多个用逗号分隔；留空则监听全链 Transfer（量大慎用）
    watch-contracts: ${WEB3_WATCH_CONTRACTS:0xdac17f958d2ee523a2206206994597c13d831ec7,0x5FbDB2315678afecb367f032d93F642f64180aa3}
#    watch-contracts: ${WEB3_WATCH_CONTRACTS:}
    # ===== 模块三：实时订阅引擎（ethLogFlowable + 断线重连）=====
    # 断线自动重连（指数退避）；隧道 socket 关闭后无法复用，重连即重建整套连接并重新订阅
    reconnect-enabled: ${WEB3_WS_RECONNECT:true}
    reconnect-initial-delay-ms: ${WEB3_WS_RECONNECT_INIT_MS:1000}
    reconnect-max-delay-ms: ${WEB3_WS_RECONNECT_MAX_MS:30000}
    # ethLogFlowable 轮询间隔(ms)：越小延迟越低但 RPC 越密；节点侧对 filter 有限制时勿设过小
    polling-interval-ms: ${WEB3_WS_POLLING_MS:3000}
    # 解码事件内存队列容量 / 工作线程单批落库条数（回调只入队，独立线程批量写库）
    event-queue-capacity: ${WEB3_WS_QUEUE_CAPACITY:4096}
    worker-batch-size: ${WEB3_WS_BATCH_SIZE:1000}
    # ===== newHeads 心跳：断线判定的辅助信号（探测“连接活着但节点不推数据”的僵尸态）=====
    # 在引擎自身 WS 连接上订阅 newHeads；超时未出块时先用 HTTP 复核链高：
    # 链在前进而 WS 没推到才重连；链空闲（如 Anvil 按需出块）只重置计时不误伤
    heartbeat-enabled: ${WEB3_WS_HEARTBEAT_ENABLED:true}
    # 超时阈值需大于链的正常出块间隔（ETH 主网 ~12s，BNB ~3s，PoA 可能更短）
    heartbeat-timeout-ms: ${WEB3_WS_HEARTBEAT_TIMEOUT_MS:90000}
    heartbeat-check-interval-ms: ${WEB3_WS_HEARTBEAT_CHECK_MS:15000}

  # ============ 模块四：充值业务路由与落库（REQ-BIZ-04）============
  deposit:
    enabled: ${WEB3_DEPOSIT_ENABLED:true}
    # 下游账务通知频道：入账成功后 PUBLISH deposit_channel {json}，账务系统订阅消费
    deposit-channel: ${WEB3_DEPOSIT_CHANNEL:deposit_channel}
    # 配置中心热钱包：key=地址，value=币种符号（留空=任意代币到账均计为该地址充值）
    # 与数据库 deposit_wallet 表取并集；同地址以 DB 为准，方便在库里精细启停
    # ⚠ 主网热钱包充值密集，建议用 contract 限定币种（如 USDT 合约地址），避免全量 Transfer 都生成充值记录
    hot-wallets:
      "0x70997970c51812dc3a010c7d01b50e0d17dc79c8": ""
    # 充值地址缓存回源间隔(ms)：路由按内存索引匹配，到期才回源 DB，避免每个事件打一次 SELECT
    wallet-cache-refresh-ms: ${WEB3_DEPOSIT_WALLET_TTL_MS:30000}
    # 确认阈值(区块数)：写入下游消息供账务判断最终确定性，0=不设置
    confirm-threshold: ${WEB3_DEPOSIT_CONFIRM_THRESHOLD:12}
    # 批量入库与路由分片大小不再可配：统一取常量 DbConsts.INSERT_BATCH_SIZE（流水表与充值表同口径）

# ============ 对外 API 安全（第 2 周：鉴权打底 + 入口限流，默认关闭不影响本地开发）============
security:
  # JWT 鉴权：拦截 /api/chain/**（actuator 健康检查/swagger 不拦），无 Token=401、过期或签名无效=401、scope 不足=403
  jwt:
    enabled: ${API_JWT_ENABLED:true}
    # Base64 编码的 HS256 密钥（原始字节 ≥ 32B），仅限本地联调；生产必走环境变量注入。
    # 本地可用 JwtTokenProvider.generateSecret() 生成临时密钥
    secret: ${API_JWT_SECRET:ntqm2QZfgwtirHJ9DG3eLJRAjJbgUDzzyNAh0k5hKsk=}
    # 内部服务间短时效（秒），建议 5-15 分钟；jti 已写入 token，为后续吊销机制留扩展点
    ttl-seconds: ${API_JWT_TTL:36000}
    # 校验允许的时钟偏差（秒），多机部署防轻微 clock skew 误杀
    clock-skew-seconds: ${API_JWT_SKEW:30}
    # POST /api/auth/token 的访问口令（需请求头 X-Issuer-Key 一致）；置空=签发接口关闭(503)。默认值为本地联调专用口令，生产必须用环境变量覆盖或直接置空关闭
    issuer-access-key: ${API_JWT_ISSUER_KEY:local-dev-issuer}
  # 入口令牌桶：限 /api/chain/logs/** 与 /api/chain/block/**（eth_getLogs 类高配额消耗接口）
  rate-limit:
    enabled: ${API_RATE_LIMIT_ENABLED:true}
    # 填充速率（许可/秒）：按 Infura 日配额反推可支撑 QPS 后取下限；允许短时突发（闲置时段令牌可积累）
    permits-per-second: ${API_RATE_LIMIT_QPS:5}
    # 等令牌超时(ms)：0=取不到立即 429 快速失败；>0=最多阻塞排队该时长
    timeout-ms: ${API_RATE_LIMIT_TIMEOUT_MS:0}

# ============ Resilience4j：RPC 容错 ============
resilience4j:
  retry:
    instances:
      rpc:
        max-attempts: 3
        wait-duration: 500ms
      # 分页拉日志：按单个区块分段粒度重试，不重跑整个拉取过程
      # 429 限流场景下用指数退避+随机抖动拉开重试间隔，避免固定 500ms 密集重击
      rpc-segment:
        max-attempts: 5
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
  ratelimiter:
    instances:
      # 主动平滑 RPC 吞吐，避免触发 Infura 429：limit-for-period 次/每秒
      rpc-segment:
        limit-for-period: 5
        limit-refresh-period: 1s
        timeout-duration: 5s
  circuitbreaker:
    instances:
      rpc:
        sliding-window-size: 20
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
      rpc-segment:
        sliding-window-size: 20
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5

# ============ SpringDoc OpenAPI ============
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# ============ Actuator + Prometheus ============
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}

# ============ XXL-Job（默认关闭，接入调度中心后打开） ============
xxl:
  job:
    enabled: ${XXL_JOB_ENABLED:false}
    admin:
      addresses: ${XXL_JOB_ADMIN_ADDRESSES:http://localhost:8088/xxl-job-admin}
    accessToken: ${XXL_JOB_ACCESS_TOKEN:}
    executor:
      appname: web3-backend
      port: 9999
      logpath: ./logs/xxl-job

logging:
  level:
    com.ray.web3: debug
    org.web3j: info
